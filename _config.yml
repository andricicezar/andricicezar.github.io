# --- Site -------------------------------------------------------------------

title          : "Cezar-Constantin Andrici"
title_separator: "|"
description    : "Ph.D. student at MPI-SP, working on verification and secure compilation."
locale         : "en-US"
url            :          # e.g. "https://cezarandrici.com"
baseurl        :

# --- Author -----------------------------------------------------------------
# Used by _includes/profile.html and the footer.

author:
  name        : "Cezar-Constantin Andrici"
  role        : "Ph.D. Student"
  affiliation : "Max Planck Institute for Security and Privacy"
  avatar      : "/assets/images/poza_profil_square-300x300.jpg"
  location    : "MPI-SP, Bochum, Germany"
  email       : "cezar.andrici@mpi-sp.org"
  cv          : "/wp-content/uploads/CV%20Andrici%20Cezar%20Constantin.pdf"
  links:
    - label: "GitHub"
      url  : "https://github.com/andricicezar"
    - label: "ORCID"
      url  : "https://orcid.org/0009-0002-7525-2440"
    - label: "LinkedIn"
      url  : "https://www.linkedin.com/in/cezar-andrici-49771663/"

# --- Navigation -------------------------------------------------------------
# Links in the top bar, in order.

navigation:
  - title: "Papers & Talks"
    url  : "/papers-talks/"
  # - title: "Blog"       # disabled for now
  #   url  : "/blog/"
  - title: "CV"
    url  : "/wp-content/uploads/CV%20Andrici%20Cezar%20Constantin.pdf"

# --- Build ------------------------------------------------------------------

include:
  - .htaccess
  - _pages
  - "wp-content"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

keep_files:
  - .git

encoding    : "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown    : kramdown
highlighter : rouge

kramdown:
  input        : GFM
  hard_wrap    : false
  auto_ids     : true
  smart_quotes : lsquo,rsquo,ldquo,rdquo

permalink : /:categories/:title/
timezone  :

plugins:
  - jekyll-sitemap
  - jekyll-feed

# --- Defaults ---------------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  - scope:
      path: ""
      type: pages
    values:
      layout: single
