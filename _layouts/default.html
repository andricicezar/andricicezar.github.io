<!doctype html>
<html lang="{{ site.locale | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} {{ site.title_separator | default: '|' }} {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  {% if site.url %}<meta property="og:url" content="{{ page.url | absolute_url }}">{% endif %}

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% feed_meta %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Inconsolata:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav class="site-nav">
        {%- for item in site.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {%- endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
    {%- for link in site.author.links %}{% if link.url %} &middot; <a href="{{ link.url }}">{{ link.label }}</a>{% endif %}{% endfor %}
  </footer>

</body>
</html>
