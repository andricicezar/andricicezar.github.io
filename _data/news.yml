  text: 'I will <strong>defend my Ph.D.</strong> thesis: <a href="/wp-content/uploads/thesis/Andrici-PhD-Thesis.pdf"><em>Securing Verified Monadic F* Programs against Linked Unverified Code</em></a>.'

